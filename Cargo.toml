[package]
name = "nexosim-control-lab"
version = "0.1.0"
edition = "2024"
description = "A small, validated NeXosim control-timing experiment"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nexosim = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
